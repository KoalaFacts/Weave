name: 'Setup .NET SDK'
description: 'Sets up .NET SDK with NuGet caching'
inputs:
  dotnet-version:
    description: '.NET 10 SDK channel used to build and run the net10.0 targets'
    required: false
    default: '10.x'
  dotnet-quality:
    description: 'SDK quality channel (ga, preview)'
    required: false
    default: 'ga'
  dotnet-next-version:
    description: '.NET 11 SDK channel; global.json selects it to build the net11.0 targets'
    required: false
    default: '11.x'
  dotnet-next-quality:
    description: 'SDK quality channel for the .NET 11 SDK until it reaches GA'
    required: false
    default: 'preview'
  cache:
    description: 'Enable NuGet package caching'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        dotnet-quality: ${{ inputs.dotnet-quality }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: '**/packages.lock.json'
    - name: Setup .NET 11 SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: ${{ inputs.dotnet-next-version }}
        dotnet-quality: ${{ inputs.dotnet-next-quality }}
