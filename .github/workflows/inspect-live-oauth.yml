name: Inspect deployed Weave OAuth ingress (read-only)

on:
  pull_request:
    branches: [main]
    paths:
      - hosts/Weave.Mailbox.Worker/scripts/inspect-live-oauth.ts
      - hosts/Weave.Mailbox.Worker/test/inspect-live-oauth.test.ts
      - .github/workflows/inspect-live-oauth.yml
  push:
    branches: [main]
    paths:
      - hosts/Weave.Mailbox.Worker/scripts/inspect-live-oauth.ts
      - hosts/Weave.Mailbox.Worker/test/inspect-live-oauth.test.ts
      - .github/workflows/inspect-live-oauth.yml
  workflow_dispatch:

permissions:
  contents: read

# Read-only inspection does not share or disrupt the demo deployment queue.
concurrency:
  group: inspect-weave-live-oauth
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: hosts/Weave.Mailbox.Worker
      - run: npm run typecheck
        working-directory: hosts/Weave.Mailbox.Worker
      - run: node --test test/inspect-live-oauth.test.ts
        working-directory: hosts/Weave.Mailbox.Worker

  inspect:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Read active demo Worker versions, OAuth binding kinds, and public route statuses
        run: node hosts/Weave.Mailbox.Worker/scripts/inspect-live-oauth.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
