name: Release / Workers
# Records a Workers release after its production deploy: tag v<version> at the deployed commit and publish a GitHub
# Release from that version's CHANGELOG.md section. Called by the production deploy in deploy-demo.yml; a manual run
# on main records a release whose deploy already succeeded. The script refuses a commit without a successful production
# deployment from main, and never moves a tag that already names another commit.
on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of a commit whose production deploy from main succeeded
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-workers
  cancel-in-progress: false
jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: read
    steps:
      - name: Require a full commit SHA
        env:
          WEAVE_RELEASE_SHA: ${{ inputs.commit }}
        run: '[[ "$WEAVE_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      # The release script comes from main; the version and notes come from the released commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: tool
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit }}
          path: release
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Tag the deployed commit and publish its GitHub Release
        run: node tool/typescript/mailbox-worker/scripts/tag-release.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEAVE_RELEASE_SHA: ${{ inputs.commit }}
          WEAVE_RELEASE_ROOT: release
