name: Correct agent-entry documentation
on:
  push:
    branches: [repair/agent-entry-docs-20261014]
permissions:
  contents: read
jobs:
  docs:
    if: github.repository == 'KoalaFacts/Weave' && github.ref == 'refs/heads/repair/agent-entry-docs-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Apply the exact already-verified documentation edits
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          source=subprocess.check_output(['git','show','75e0b3f1148530d620027a43eeebf283a34d6314:.github/workflows/repair-agent-docs-20261014.yml'],text=True)
          marker="          python3 - <<'PY'\n"
          start=source.index(marker)+len(marker)
          end=source.index('\n          PY',start)
          program=textwrap.dedent(source[start:end])
          exec(compile(program,'verified-document-edits','exec'))
          PY
      - name: Verify repository guards and exact edit scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -v
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected={'AGENTS.md','README.md','hosts/Weave.Mailbox.Worker/README.md','.github/workflows/README.md'}
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual==expected,actual
          PY
          mkdir -p /tmp/weave-doc-evidence
          git diff -- AGENTS.md README.md hosts/Weave.Mailbox.Worker/README.md .github/workflows/README.md > /tmp/weave-doc-evidence/docs.patch
          cp .github/workflows/README.md /tmp/weave-doc-evidence/workflows-README.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-documentation-patch
          path: /tmp/weave-doc-evidence/
          retention-days: 14
      - name: Commit only non-workflow documentation and remove this one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = repair/agent-entry-docs-20261014
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          # The workflow README is retained as an artifact for the separately authorized connector write.
          git add AGENTS.md README.md hosts/Weave.Mailbox.Worker/README.md
          git rm .github/workflows/repair-agent-docs-20261014.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align canonical SDK prerequisites and public registry deployment documentation'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
