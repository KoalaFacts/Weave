name: Read-only Weave D1 Preservation Inventory
on:
  workflow_dispatch:
  # Authenticated fallback for the existing GitHub connector, which cannot
  # invoke workflow_dispatch. Never run for other issues or commenters.
  issue_comment:
    types: [created]

permissions:
  contents: read

# Only an authorized inventory job may acquire the deployment lock; public
# issue comments whose job is skipped must not queue or delay deployment.
jobs:
  inventory:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.number == 236 &&
        github.event.issue.pull_request == null &&
        github.event.comment.body == '/weave-d1-inventory' &&
        github.event.comment.user.login == 'ldsenow' &&
        github.event.comment.author_association == 'MEMBER'))
    concurrency:
      group: deploy-weave-worker-demo
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact owner-authored request and unchanged main
        shell: bash
        env:
          WEAVE_REQUEST_ISSUE: ${{ github.event.issue.number }}
          WEAVE_REQUEST_USER: ${{ github.event.comment.user.login }}
          WEAVE_REQUEST_ASSOCIATION: ${{ github.event.comment.author_association }}
          WEAVE_REQUEST_BODY: ${{ github.event.comment.body }}
          WEAVE_REQUEST_IS_PR: ${{ github.event.issue.pull_request != null }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) ;;
            issue_comment)
              test "$GITHUB_ACTOR" = ldsenow
              test "$WEAVE_REQUEST_ISSUE" = 236
              test "$WEAVE_REQUEST_USER" = ldsenow
              test "$WEAVE_REQUEST_ASSOCIATION" = MEMBER
              test "$WEAVE_REQUEST_BODY" = /weave-d1-inventory
              test "$WEAVE_REQUEST_IS_PR" = false
              ;;
            *) echo "Unsupported inventory event" >&2; exit 1 ;;
          esac
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: typescript/mailbox-worker
      - name: Verify the read-only inventory implementation
        working-directory: typescript/mailbox-worker
        run: |
          npm run typecheck
          node --test test/audit-existing-d1.test.ts
      - name: Inventory only the verified existing demo D1
        working-directory: typescript/mailbox-worker
        run: node scripts/audit-existing-d1.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Retain aggregate-only protected evidence, even on review findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weave-read-only-d1-${{ github.run_id }}
          path: typescript/mailbox-worker/test-results/read-only-d1/result.json
          retention-days: 7
          if-no-files-found: warn
