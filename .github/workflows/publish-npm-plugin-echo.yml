name: Publish npm Echo Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to publish
        required: true
        type: string

concurrency:
  group: publish-npm-plugin-echo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@koalafacts/weave-plugin-echo
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm/weave-plugin-echo
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Verify requested package identity
        run: >-
          node -e "const p=require('./package.json');
          if(p.name!=='@koalafacts/weave-plugin-echo'||p.version!==process.env.EXPECTED_VERSION)
          process.exit(1)"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check and exercise package
        run: |
          npm run check
          npm test
          npm run pack:check
          npm audit --omit=dev --audit-level=high
      - name: Publish with npm trusted publishing
        run: npm publish --access public
