name: Inspect dependency comparison shape

on:
  push:
    branches: [dependabot/nuget/multi-41e1e6a291]
    paths: [.github/workflows/inspect-dependency-comparison.yml]

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'KoalaFacts/Weave' && github.ref == 'refs/heads/dependabot/nuget/multi-41e1e6a291'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect fixed already-submitted comparison without relaxing the guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args): return None
          url = 'https://api.github.com/repos/KoalaFacts/Weave/dependency-graph/compare/dea58f0699d15b8ded1d09acad8b4e755c160732...4e76c7f320fafb7e51d9f2a2029a83def5522317?per_page=100&page=1'
          request = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'X-GitHub-Api-Version': '2022-11-28'})
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          with opener.open(request, timeout=30) as response:
              data = response.read(2*1024*1024+1)
              if response.status != 200 or len(data)>2*1024*1024: raise SystemExit('Invalid diagnostic response')
              value = json.loads(data)
              report = {'status': response.status, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(),
                        'kind': type(value).__name__, 'has_next': 'rel="next"' in response.headers.get('Link', ''),
                        'has_snapshot_warning': bool(response.headers.get('x-github-dependency-graph-snapshot-warnings', ''))}
              if isinstance(value, list):
                  report.update(count=len(value),
                      non_objects=sum(not isinstance(v,dict) for v in value),
                      change_types=sorted({str(v.get('change_type')) for v in value if isinstance(v,dict)}),
                      manifest_types=sorted({type(v.get('manifest')).__name__ for v in value if isinstance(v,dict)}))
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'comparison-shape'; output.mkdir()
          (output/'shape.json').write_text(json.dumps(report,indent=2)+'\n')
          (output/'comparison.json').write_bytes(data)
          print(json.dumps(report))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-comparison-shape
          path: ${{ runner.temp }}/comparison-shape/
          if-no-files-found: error
          retention-days: 7
