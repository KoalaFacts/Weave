name: Merge Review Snapshot

on:
  push:
    branches: [feat/m1-durable-invocations]
    paths: [.github/workflows/merge-review-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: |
          mkdir -p merge-review
          git rev-parse HEAD > merge-review/source-sha.txt
          git archive --format=tar HEAD -o merge-review/source.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: invocation-merge-review-source
          path: merge-review/
          retention-days: 1
