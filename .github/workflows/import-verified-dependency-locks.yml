name: Import verified dependency lock blobs

on:
  push:
    branches: [dependabot/nuget/multi-41e1e6a291]
    paths: [.github/workflows/import-verified-dependency-locks.yml]

permissions:
  contents: write
  actions: read

jobs:
  import:
    if: github.repository == 'KoalaFacts/Weave' && github.ref == 'refs/heads/dependabot/nuget/multi-41e1e6a291'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout, project execution, package installation, or ref update.
      # Only exact, independently inspected JSON lock bytes become immutable blobs.
      - name: Import allowlisted lockfile blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, io, json, subprocess, zipfile
          data = subprocess.check_output(['gh', 'api', 'repos/KoalaFacts/Weave/actions/artifacts/10671499619/zip'])
          if hashlib.sha256(data).hexdigest() != '382084ca5d4915d54ebd6dbc1d5c8f1e62ddb36ebf8e475ff3f141f480356d4b':
              raise SystemExit('Preparation archive hash mismatch')
          allowed = {
              'extensions/Weave.Actions/packages.lock.json': '4b442a1aaf43234f22ca9bdcc6a4f047b0c1ae7e',
              'extensions/Weave.AgentRuntime/packages.lock.json': '026eba63bc315744b2888c95d63e5771ec6a4b90',
              'extensions/Weave.Cli.Shell/packages.lock.json': '487f46c54702eaac4012a35fa1e48ab02f941a23',
              'extensions/Weave.Cli.Tui/packages.lock.json': 'ee9fa8336ab3a5551797a4e7a48a41362f2fe25a',
              'extensions/Weave.CliTools/packages.lock.json': '43a9b9dfe10b8172a5e70920d5aef25ab67def28',
              'extensions/Weave.Dapr/packages.lock.json': '43a9b9dfe10b8172a5e70920d5aef25ab67def28',
              'extensions/Weave.Deploy/packages.lock.json': '43a9b9dfe10b8172a5e70920d5aef25ab67def28',
              'extensions/Weave.DirectHttp/packages.lock.json': '43a9b9dfe10b8172a5e70920d5aef25ab67def28',
              'extensions/Weave.FileSystem/packages.lock.json': '43a9b9dfe10b8172a5e70920d5aef25ab67def28',
              'extensions/Weave.Mcp/packages.lock.json': '43a9b9dfe10b8172a5e70920d5aef25ab67def28',
              'extensions/Weave.OpenApi/packages.lock.json': '43a9b9dfe10b8172a5e70920d5aef25ab67def28',
              'extensions/Weave.Security.Postgres/packages.lock.json': '8321974cba01b33fc27d5c2368c21a7c1f82b739',
              'extensions/Weave.Security.Sqlite/packages.lock.json': '725c5a7fa16287c723d0f25bcaead2f2eff0be84',
              'extensions/Weave.Silo.Clustering.SqlServer/packages.lock.json': '5083985cbee1b26692881b97460192060ddd1c8e',
              'extensions/Weave.Silo.Clustering.Sqlite/packages.lock.json': '02d19e706b9758c02a7e22260b9380410016cdcf',
              'hosts/Weave.AppHost/packages.lock.json': 'efca8ebc49a0178c00e9d0219a537949210f4ecd',
              'hosts/Weave.Cli/packages.lock.json': '1bff62494ee2eb00acd91d3bda00bd8d7c1b53a6',
              'hosts/Weave.Dashboard/packages.lock.json': '3748419ab3019e831efba1b1b3814106d9aac68b',
              'hosts/Weave.Host/packages.lock.json': 'fbcdb2ed9730eff8fbd73d325009ed6d3971bcb6',
              'src/packages.lock.json': '9be2f2340296745c3b0540bc001c0bfa4ce697c1',
              'tests/Weave.Actions.Tests/packages.lock.json': 'acbb5d1fb9eca537325114d57537761abe2029dc',
              'tests/Weave.Agents.Tests/packages.lock.json': '84c9c766f960f8da29d072f184caae82870b5cac',
              'tests/Weave.Cli.Tests/packages.lock.json': 'e4ec0e912d40d8bed7fec93a693312e3a47fb9e6',
              'tests/Weave.Deploy.Tests/packages.lock.json': '43a2477d4822f2253274ad21055f9142b99e2909',
              'tests/Weave.Security.Tests/packages.lock.json': '50be3af2e9be6e9da13cdc1dce9855c126651f30',
              'tests/Weave.Shared.Tests/packages.lock.json': '0cb8cfd31a84c4d22438c0bae7b0e9c6ab79973f',
              'tests/Weave.Silo.Tests/packages.lock.json': '39dea6c259ea62b3a3e6f74397a77f4aa69b4c81',
              'tests/Weave.Tools.Tests/packages.lock.json': '30af2c133d4b1f2f55f1f086bb5a0f874798804b',
              'tests/Weave.Workspaces.Tests/packages.lock.json': '2114cb892f1c378157d9a4dd2b8c7d2b305d5493'
          }
          with zipfile.ZipFile(io.BytesIO(data)) as outer:
              nested = outer.read('generated-locks.zip')
          if hashlib.sha256(nested).hexdigest() != '70ef6eb5b786c31b5f106cced473d17b8a186af0f7752024663bc37d85d5c7e0':
              raise SystemExit('Generated locks archive hash mismatch')
          verified = {}
          with zipfile.ZipFile(io.BytesIO(nested)) as archive:
              manifest = json.loads(archive.read('manifest.json'))
              if manifest['source'] != 'b1b53a6a3a166f825b4d3bef3308c18539c91669' or {f['path']: f['sha'] for f in manifest['files']} != allowed:
                  raise SystemExit('Generated lock provenance mismatch')
              for path, expected in allowed.items():
                  content = archive.read(path)
                  actual = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
                  if actual != expected:
                      raise SystemExit('Lockfile blob mismatch')
                  json.loads(content)
                  verified[expected] = content.decode('utf-8')
          for expected, content in verified.items():
              result = json.loads(subprocess.check_output(
                  ['gh', 'api', '--method', 'POST', 'repos/KoalaFacts/Weave/git/blobs', '--input', '-'],
                  input=json.dumps({'content': content, 'encoding': 'utf-8'}).encode()))
              if result['sha'] != expected:
                  raise SystemExit('Stored blob mismatch')
          print('Verified and stored', len(verified), 'unique immutable blobs for', len(allowed), 'lock paths; no refs changed.')
