name: One-time branch integration audit

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/branch-audit-once.yml']
  push:
    branches: [chore/mainline-foundation-plan]
    paths: ['.github/workflows/branch-audit-once.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record history without executing retained branches
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/branch-audit"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          main = git('rev-parse', 'refs/remotes/origin/main')
          rows = []
          for line in git('for-each-ref', '--format=%(refname) %(objectname)', 'refs/remotes/origin/').splitlines():
              ref, sha = line.split(' ', 1)
              if ref.endswith('/HEAD') or ref.endswith('/main'):
                  continue
              counts = git('rev-list', '--left-right', '--count', main + '...' + sha).split()
              rows.append({'branch': ref.removeprefix('refs/remotes/origin/'), 'sha': sha,
                           'behind': int(counts[0]), 'ahead': int(counts[1]),
                           'patch_comparison': git('cherry', main, sha).splitlines()})
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'branch-audit'
          (target / 'branches.json').write_text(json.dumps({'main': main, 'branches': rows}, indent=2) + '\n')
          print(json.dumps({'main': main, 'branches': rows}, indent=2))
          PY
          git bundle create "$RUNNER_TEMP/branch-audit/history.bundle" --all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: branch-audit
          path: ${{ runner.temp }}/branch-audit/
          retention-days: 3
          if-no-files-found: error
