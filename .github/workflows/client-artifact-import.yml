name: Import verified client blobs

on:
  push:
    branches: [feat/typescript-rust-clients]
    paths: [.github/workflows/client-artifact-import.yml]

permissions:
  contents: write
  actions: read

jobs:
  import:
    if: github.repository == 'KoalaFacts/Weave' && github.ref == 'refs/heads/feat/typescript-rust-clients'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Transfer only the previously downloaded and independently hash-verified generated files.
      # No checkout, package install, branch/ref update, or execution of artifact contents.
      - name: Store exact verified artifacts as immutable Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, io, json, subprocess, zipfile
          archive = subprocess.check_output(['gh', 'api', 'repos/KoalaFacts/Weave/actions/artifacts/10599380278/zip'])
          if hashlib.sha256(archive).hexdigest() != '35502b4f3e679131db19972bb4af88c9d51861a8bc9cf4d4f1c4c497144f9bc4':
              raise SystemExit('Artifact integrity mismatch')
          allowed = {
              'clients/rust/Cargo.lock': '3d4137c7583d2e17a30c535edfed75ba0ec384e6',
              'clients/rust/src/lib.rs': 'e0e1b47fe2914258d51f6a58ec119133158dd702',
              'clients/rust/src/main.rs': '155b5527ccc231b9b8e9c9ff7c44df3bfc9f9eae',
              'sdk/typescript/package-lock.json': '2911dcdb723d77e2ff5f5cb2163dfaae5eb9cf15'
          }
          with zipfile.ZipFile(io.BytesIO(archive)) as source:
              for path, expected in allowed.items():
                  data = source.read(path)
                  blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  if blob != expected:
                      raise SystemExit('Generated file hash mismatch')
                  result = json.loads(subprocess.check_output(
                      ['gh', 'api', '--method', 'POST', 'repos/KoalaFacts/Weave/git/blobs', '--input', '-'],
                      input=json.dumps({'content': data.decode('utf-8'), 'encoding': 'utf-8'}).encode()))
                  if result['sha'] != expected:
                      raise SystemExit('Stored blob hash mismatch')
                  print(path, result['sha'])
