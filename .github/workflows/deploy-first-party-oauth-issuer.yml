name: Protected Weave first-party GitHub OAuth issuer

on:
  workflow_dispatch:
    inputs:
      confirm_source_sha:
        description: Exact main commit to deploy; no moving target
        required: true
        type: string
      confirm_authorized_kv_do:
        description: Confirm the approved existing KV namespace and first SQLite Durable Object migration require no unapproved plan or fees
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Serialize with existing protected D1 and Worker releases. No auto-rollout.
concurrency:
  group: deploy-weave-worker-demo
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
      actions: read
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'ldsenow' &&
      inputs.confirm_authorized_kv_do == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse stale or unapproved exact source
        shell: bash
        env:
          CONFIRMED_SHA: ${{ inputs.confirm_source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = ldsenow
          test "$CONFIRMED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require exact-main-push CI, Worker/browser, Security and OAuth verification
        working-directory: typescript/auth-worker
        run: node scripts/require-main-verification.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install locked mailbox Worker dependencies for real workerd integration tests
        working-directory: typescript/mailbox-worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned authorization Worker dependencies
        working-directory: typescript/auth-worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the exact issuer source without credentials
        working-directory: typescript/auth-worker
        run: |
          npm run typecheck
          npm run test:portable
          npm run test:workerd
          npm run build
          npm audit --audit-level=high

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout the same approved source after protection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck exact main head after environment approval
        shell: bash
        env:
          CONFIRMED_SHA: ${{ inputs.confirm_source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = ldsenow
          test "$CONFIRMED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exactly locked OAuth Worker dependencies
        working-directory: typescript/auth-worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Publish only the approved first-party issuer (no D1 migration or resource binding)
        working-directory: typescript/auth-worker
        run: node scripts/deploy-demo.ts
        env:
          WEAVE_APPROVED_ISSUER_DEPLOY: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEAVE_AUTH_KV_NAMESPACE_ID: ${{ secrets.WEAVE_AUTH_KV_NAMESPACE_ID }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          HUMAN_SESSION_KEY: ${{ secrets.HUMAN_SESSION_KEY }}
          WEAVE_TRIAL_GITHUB_SUBJECTS: ${{ secrets.WEAVE_TRIAL_GITHUB_SUBJECTS }}
          OAUTH_ISSUER: https://weave-auth-demo.weave-389.workers.dev
          OAUTH_RESOURCE: https://demo.weave-389.workers.dev/mcp
