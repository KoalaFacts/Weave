name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Architecture checks
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Setup Node for real process fixtures
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Restore
        run: dotnet restore Weave.slnx

      - name: Build
        run: dotnet build Weave.slnx --no-restore -c Release

      - name: Install the pinned Dashboard Playwright browser
        run: pwsh tests/Weave.Silo.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps --no-shell chromium

      - name: Prepare the managed Dashboard browser sandbox
        uses: ./.github/actions/setup-playwright-sandbox
        with:
          playwright-package: tests/Weave.Silo.Tests/bin/Release/net10.0/.playwright/package

      - name: Pack and validate the tool without publishing
        env:
          VERSION: 0.0.0-ci-validation
        run: |
          dotnet pack hosts/Weave.Cli/Weave.Cli.csproj -c Release --no-build \
            "-p:Version=$VERSION" -p:IncludeSymbols=false -o packages
          python3 scripts/release/guard.py validate-packages

      - name: Test
        env:
          WEAVE_DASHBOARD_EVIDENCE: ${{ runner.temp }}/dashboard-browser-evidence
        run: >-
          dotnet test --solution Weave.slnx --no-build -c Release
          -- --report-xunit-trx --results-directory ./test-results

      - name: Upload Dashboard browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dashboard-browser-evidence
          path: ${{ runner.temp }}/dashboard-browser-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Restore coverage tool and analyzer
        run: |
          dotnet tool restore --tool-manifest .config/dotnet-tools.json
          dotnet dotnet-coverage --version
          dotnet restore scripts/DevTool/DevTool.csproj --locked-mode
          dotnet build scripts/DevTool/DevTool.csproj --no-restore -c Release
          dotnet format scripts/DevTool/DevTool.csproj --no-restore --verify-no-changes

      - name: Coverage analyzer regressions
        run: python3 -m unittest discover -s scripts/coverage-tests -v

      - name: Collect and enforce tested-owner coverage
        timeout-minutes: 30
        shell: bash
        run: |
          mkdir -p TestResults
          dotnet run --project scripts/DevTool --no-build --no-restore -c Release -- coverage --threshold 90 2>&1 | tee TestResults/coverage-gate.log

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-evidence
          path: TestResults/
          if-no-files-found: error
          retention-days: 30

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2
        if: always()
        with:
          files: test-results/**/*.trx
          check_name: 'Test Results'
          comment_mode: 'off'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: ./test-results/**/*.trx
          retention-days: 30

  # Retain the check identity until required-check configuration can be verified.
  exact-base-coverage-diagnostic:
    name: Exact-base coverage (diagnostic only)
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Propagate the current build and coverage gate
        env:
          GATE_RESULT: ${{ needs.build-and-test.result }}
        shell: bash
        run: |
          if [ "$GATE_RESULT" != success ]; then
            echo 'The current Build & Test gate did not succeed.'
            exit 1
          fi
          echo 'Historical baseline diagnostic retired; the current Build & Test gate succeeded.'

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Strict locked dependency audit
        uses: ./.github/actions/strict-nuget-audit

      - name: Retain strict audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-dependency-audit
          path: artifacts/dependency-audit/
          retention-days: 14

      - name: Build (warnings as errors)
        run: dotnet build Weave.slnx --no-restore -c Release /p:TreatWarningsAsErrors=true

      # dotnet format loads the Debug design-time graph; build its analyzer reference too.
      - name: Build source generator for formatting
        run: dotnet build tools/Weave.SourceGen/Weave.SourceGen.csproj --no-restore -c Debug /p:TreatWarningsAsErrors=true

      - name: Check formatting
        run: >-
          dotnet format Weave.slnx --no-restore --verify-no-changes --verbosity diagnostic
          --exclude src/Authority/CapabilityGrantMatcher.cs
          src/Composition/Cqrs/CommandDispatcher.cs src/Composition/Cqrs/ICommandDispatcher.cs
          src/Composition/Cqrs/ICommandHandler.cs src/Composition/Cqrs/IQueryDispatcher.cs
          src/Composition/Cqrs/IQueryHandler.cs src/Composition/Cqrs/QueryDispatcher.cs
          src/Composition/Events/DomainEvent.cs src/Composition/Events/IDomainEvent.cs
          src/Composition/Events/IEventBus.cs src/Composition/Events/InProcessEventBus.cs
          src/Agents/AgentId.cs src/Agents/AgentTaskId.cs src/Channels/ChannelId.cs
          src/Resources/ContainerId.cs src/Memory/EpisodeId.cs src/Plugins/Catalog/MarketplaceItemId.cs
          src/Resources/NetworkId.cs src/Skills/SkillId.cs src/Workspaces/Templates/TemplateId.cs
          src/Users/UserId.cs src/Workspaces/WorkspaceId.cs
          src/Composition/Lifecycle/ILifecycleHook.cs src/Composition/Lifecycle/ILifecycleManager.cs
          src/Composition/Lifecycle/LifecycleContext.cs src/Composition/Lifecycle/LifecycleManager.cs
          src/Composition/Lifecycle/LifecyclePhase.cs src/Plugins/EventBusProxy.cs
          src/Plugins/PluginServiceBroker.cs src/Credentials/SecretSafeException.cs
          src/Credentials/SecretValue.cs src/Credentials/SecretValueJsonConverter.cs
          src/Composition/Text/ControlCharFilter.cs src/Composition/VirtualActors/IActorState.cs
          src/Composition/VirtualActors/IActorTimerRegistry.cs src/Composition/VirtualActors/IVirtualActorProvider.cs
          src/Composition/VirtualActors/VirtualActorId.cs src/Composition/WeavePorts.cs

  windows-cli-boundaries:
    name: Windows CLI boundary tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
      - name: Restore locked CLI test dependencies
        run: dotnet restore tests/Weave.Cli.Tests/Weave.Cli.Tests.csproj --locked-mode
      - name: Build CLI tests
        run: dotnet build tests/Weave.Cli.Tests/Weave.Cli.Tests.csproj --no-restore -c Release
      - name: Test CLI boundaries on Windows
        run: >-
          dotnet test --project tests/Weave.Cli.Tests/Weave.Cli.Tests.csproj --no-build -c Release
          -- --report-xunit-trx --results-directory ./test-results
      - name: Retain Windows CLI results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-cli-test-results
          path: test-results/**/*.trx
          if-no-files-found: error
          retention-days: 30

  dependency-lock-validation:
    # Retain the required-check identities. Base validates historical committed
    # graph evidence; only the proposed head must satisfy a fresh locked restore.
    name: Locked dependency graph (${{ matrix.source }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        source: [base, head]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ matrix.source == 'base' && '97452c5adf605b69234798ead7e1b7550f425ccb' || (github.event.pull_request.head.sha || github.sha) }}
          persist-credentials: false
      - name: Set up .NET for the proposed head
        if: matrix.source == 'head'
        uses: ./.github/actions/setup-dotnet
      - name: Validate the exact head committed dependency closure
        if: matrix.source == 'head'
        run: |
          dotnet restore Weave.slnx --locked-mode
          git diff --exit-code -- '**/packages.lock.json'
      - name: Validate the exact committed historical baseline
        if: matrix.source == 'base'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_BASE_REF: refs/heads/${{ github.base_ref || 'main' }}
        shell: python
        run: |
          import importlib.util, json, os, pathlib
          spec = importlib.util.spec_from_file_location('producer', 'scripts/submit_nuget_snapshots.py')
          producer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(producer)
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'dependency-baseline'
          output.mkdir(parents=True, exist_ok=True)
          report = {'status': 'unavailable', 'validation': 'committed-lock-graph',
                    'restore_performed': False, 'source_sha': os.environ['PR_BASE_SHA'],
                    'source_ref': os.environ['PR_BASE_REF']}
          try:
              repository = os.environ['GITHUB_REPOSITORY']
              api = producer.Api(repository, os.environ['GH_TOKEN'])
              plan = producer.snapshot(api, report['source_sha'], report['source_ref'],
                                       repository, os.environ['GITHUB_RUN_ID'], {})
              (output / 'baseline.json').write_text(json.dumps(plan, indent=2) + '\n')
              report.update(status='available', **plan['metadata'])
          except (producer.SnapshotError, KeyError, TypeError, ValueError, RecursionError) as error:
              report['failure'] = str(error) if isinstance(error, producer.SnapshotError) else 'invalid-baseline-input'
          (output / 'validation.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Historical dependency baseline\n\n')
              summary.write('Exact committed lock graph available.\n' if report['status'] == 'available'
                            else '**Unavailable — snapshot production blocked.**\n')
              summary.write('\nThis validates historical comparison data and does not establish a fresh locked restore '
                            'of the base. The exact head must pass strict locked restore and all dependency policies.\n')
          if report['status'] != 'available':
              print('::error::Historical dependency baseline is unavailable; snapshot production is blocked.')
          raise SystemExit(0 if report['status'] == 'available' else 1)
      - name: Retain historical baseline validation evidence
        if: ${{ always() && matrix.source == 'base' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-baseline
          path: ${{ runner.temp }}/dependency-baseline/
          if-no-files-found: error
          retention-days: 14

  dependency-snapshots:
    name: Submit verified dependency snapshots
    needs: dependency-lock-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Only the reviewed immutable producer is executable in this job.
      # Source commits are read as JSON blobs via the API, never checked out here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: 97452c5adf605b69234798ead7e1b7550f425ccb
          persist-credentials: false
      - name: Submit exact base and head lock graphs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_REF: refs/heads/${{ github.base_ref || 'main' }}
          PR_HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.number) || github.ref }}
        run: python3 scripts/submit_nuget_snapshots.py --output "$RUNNER_TEMP/dependency-snapshots"
      - name: Retain source and submission evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-snapshots
          path: ${{ runner.temp }}/dependency-snapshots/
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency Review
    needs: dependency-snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Require dependency comparison evidence
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/check_dependency_review_evidence.py
          --snapshot-wait-seconds 600
          --report "$RUNNER_TEMP/dependency-review-evidence.json"

      - name: Upload dependency comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-review-evidence
          path: ${{ runner.temp }}/dependency-review-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Dependency Review
        id: dependency-policy
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          license-check: true
          comment-summary-in-pr: never

      - name: Set up Node for license policy
        if: ${{ !cancelled() && steps.dependency-policy.outcome != 'skipped' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Materialize dependency policy outputs
        if: ${{ !cancelled() && steps.dependency-policy.outcome != 'skipped' }}
        shell: node {0}
        run: |
          const { writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          // Serialized strings stay data in the runner's script file, never shell or environment input.
          writeFileSync(join(process.env.RUNNER_TEMP, 'dependency-changes.json'),
            ${{ toJSON(steps.dependency-policy.outputs['dependency-changes']) }}, 'utf8');
          writeFileSync(join(process.env.RUNNER_TEMP, 'invalid-license-changes.json'),
            ${{ toJSON(steps.dependency-policy.outputs['invalid-license-changes']) }}, 'utf8');

      - name: Require complete license evidence
        if: ${{ !cancelled() && steps.dependency-policy.outcome != 'skipped' }}
        run: >-
          python3 scripts/check_dependency_license_evidence.py
          --changes "$RUNNER_TEMP/invalid-license-changes.json"
          --report "$RUNNER_TEMP/dependency-license-evidence.json"

      - name: Install locked license policy dependencies
        if: ${{ !cancelled() && steps.dependency-policy.outcome != 'skipped' }}
        run: npm ci --prefix tools/dependency-license-policy --ignore-scripts --no-audit --no-fund

      - name: Audit license policy dependencies
        if: ${{ !cancelled() && steps.dependency-policy.outcome != 'skipped' }}
        run: npm audit --prefix tools/dependency-license-policy --omit=dev --audit-level=high

      - name: Type-check license policy tools
        if: ${{ !cancelled() && steps.dependency-policy.outcome != 'skipped' }}
        run: npm run typecheck --prefix tools/dependency-license-policy

      - name: Require allowed dependency licenses
        if: ${{ !cancelled() && steps.dependency-policy.outcome != 'skipped' }}
        run: >-
          node tools/dependency-license-policy/check-license-policy.ts
          "$RUNNER_TEMP/dependency-changes.json"
          "$RUNNER_TEMP/dependency-review-evidence.json"
          "$RUNNER_TEMP/dependency-license-policy.json"

      - name: Retain license evidence outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-license-evidence
          path: |
            ${{ runner.temp }}/dependency-license-evidence.json
            ${{ runner.temp }}/dependency-license-policy.json
          if-no-files-found: error
          retention-days: 14

      - name: Diagnose fixed dependency comparison
        if: ${{ !cancelled() && github.event.pull_request.number == 223 }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DIAGNOSTIC_REPORT: ${{ runner.temp }}/dependency-comparison-diagnostic.json
        run: python3 scripts/diagnose_dependency_comparison.py
