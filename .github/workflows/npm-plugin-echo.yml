name: npm Echo Plugin

on:
  pull_request:
    branches: [main]
    paths:
      - 'npm/weave-plugin-echo/**'
      - 'tests/Weave.Silo.Tests/Invocations/EchoPluginTests.cs'
      - 'tests/Weave.Tools.Tests/HttpMcpTransportWireRoundTripTests.cs'
      - 'extensions/Weave.Mcp/InvokeTool/HttpMcpTransport.cs'
      - '.github/workflows/npm-plugin-echo.yml'
  push:
    branches: [main]
    paths:
      - 'npm/weave-plugin-echo/**'
      - 'tests/Weave.Silo.Tests/Invocations/EchoPluginTests.cs'
      - 'tests/Weave.Tools.Tests/HttpMcpTransportWireRoundTripTests.cs'
      - 'extensions/Weave.Mcp/InvokeTool/HttpMcpTransport.cs'
      - '.github/workflows/npm-plugin-echo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: npm/weave-plugin-echo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check TypeScript
        run: npm run check
      - name: Exercise both transports
        run: npm test
      - name: Check exact npm contents
        run: npm run pack:check
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet
      - name: Restore Weave's connector checks
        working-directory: .
        run: dotnet restore Weave.slnx --locked-mode
      - name: Build Weave's connector checks
        working-directory: .
        env:
          EchoPluginExamples: 'true'
        run: dotnet build Weave.slnx --no-restore -c Release /p:TreatWarningsAsErrors=true
      - name: Verify HTTP notification responses
        working-directory: .
        run: >-
          dotnet test --project tests/Weave.Tools.Tests/Weave.Tools.Tests.csproj
          --no-build -c Release --filter-class Weave.Tools.Tests.HttpMcpTransportWireRoundTripTests
      - name: Verify Weave authorization and journal
        working-directory: .
        env:
          EchoPluginExamples: 'true'
          WEAVE_ECHO_SPEC: npm/weave-plugin-echo/tool.json
        run: >-
          dotnet test --project tests/Weave.Silo.Tests/Weave.Silo.Tests.csproj
          --no-build -c Release --filter-class Weave.Silo.Tests.Invocations.EchoPluginTests
      - name: Verify installed HTTP Echo through Weave
        working-directory: .
        run: |
          : > "$RUNNER_TEMP/weave-echo-http.log"
          node npm/weave-plugin-echo/dist/cli.js --http --port 0 2> "$RUNNER_TEMP/weave-echo-http.log" &
          echo_pid=$!
          trap 'kill "$echo_pid" 2>/dev/null || true' EXIT
          endpoint=""
          for attempt in $(seq 1 100); do
            endpoint=$(sed -n 's/^Echo MCP endpoint: //p' "$RUNNER_TEMP/weave-echo-http.log" | head -n 1)
            if [ -n "$endpoint" ]; then break; fi
            sleep 0.1
          done
          if [ -z "$endpoint" ]; then cat "$RUNNER_TEMP/weave-echo-http.log"; exit 1; fi
          WEAVE_ECHO_TEST_ENDPOINT="$endpoint" dotnet test \
            --project tests/Weave.Silo.Tests/Weave.Silo.Tests.csproj \
            --no-build -c Release -- \
            --filter-method Weave.Silo.Tests.Plugins.McpWorkspacePluginFlowTests.EchoPackage_HttpInstallation_InvokesThroughWeave
