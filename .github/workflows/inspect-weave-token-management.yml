name: Inspect existing Weave token management (read-only)

on:
  pull_request:
    branches: [main]
    paths:
      - experiments/cloudflare-managed-oauth/**
      - .github/workflows/inspect-weave-token-management.yml
  push:
    branches: [main]
    paths:
      - experiments/cloudflare-managed-oauth/token-management*
      - .github/workflows/inspect-weave-token-management.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: inspect-weave-token-management
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: typescript/mailbox-worker
      - name: Strictly typecheck all Access operator tools and tests
        run: >-
          typescript/mailbox-worker/node_modules/.bin/tsc --noEmit --strict
          --target es2022 --module esnext --moduleResolution bundler
          --allowImportingTsExtensions --lib es2022,dom,dom.iterable
          --typeRoots typescript/mailbox-worker/node_modules/@types --types node
          experiments/cloudflare-managed-oauth/*.ts
      - name: Test token and Access boundaries without credentials
        run: node --test experiments/cloudflare-managed-oauth/*.test.ts

  inspect:
    needs: verify
    if: github.repository == 'KoalaFacts/Weave' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Reject stale main before using the existing credential
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Read only the current token's management metadata
        run: node experiments/cloudflare-managed-oauth/token-management.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
