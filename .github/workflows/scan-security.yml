name: Security Scan

on:
  schedule:
    - cron: '0 3 * * MON'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  vulnerability-audit:
    name: Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Strict locked dependency audit
        uses: ./.github/actions/strict-nuget-audit

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-audit
          path: artifacts/dependency-audit/
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo 'Strict restore, machine-readable vulnerability evidence and deprecation output are retained in the security-audit artifact.' >> "$GITHUB_STEP_SUMMARY"
