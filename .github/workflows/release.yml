name: Create Release
run-name: Create Release v${{ inputs.version || 'unspecified' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.1.0 or 0.2.0-preview.1)'
        required: true
        type: string

concurrency:
  group: create-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  create-release:
    name: Release v${{ inputs.version }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      id-token: write
      attestations: write

    env:
      INPUT_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate version format
        id: version
        run: |
          python3 scripts/release/guard.py validate-version

      - name: Export validated version
        env:
          VALIDATED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf 'VERSION=%s\n' "$VALIDATED_VERSION" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Restore
        run: dotnet restore Weave.slnx --locked-mode

      - name: Build
        run: dotnet build Weave.slnx --no-restore -c Release

      - name: Test
        run: dotnet test --solution Weave.slnx --no-build -c Release

      - name: Pack .NET tool
        run: |
          dotnet pack hosts/Weave.Cli/Weave.Cli.csproj \
            -c Release --no-build \
            "-p:Version=$VERSION" \
            -p:IncludeSymbols=false \
            -o packages

      - name: Verify package identity and version
        run: python3 scripts/release/guard.py validate-packages

      - name: Generate package provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: 'packages/*.nupkg'

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget-packages-v${{ env.VERSION }}
          path: |
            packages/*.nupkg
          retention-days: 90

  publish-binaries:
    name: Build ${{ matrix.rid }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive: zip
          - rid: win-arm64
            os: windows-latest
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          - rid: linux-arm64
            os: ubuntu-latest
            archive: tar.gz
          - rid: osx-x64
            os: macos-latest
            archive: tar.gz
          - rid: osx-arm64
            os: macos-latest
            archive: tar.gz

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    env:
      VERSION: ${{ needs.create-release.outputs.version }}
      RID: ${{ matrix.rid }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Publish self-contained
        shell: bash
        run: |
          dotnet publish hosts/Weave.Cli/Weave.Cli.csproj \
            -c Release -r "$RID" --self-contained true \
            -p:PublishSingleFile=true -p:PublishTrimmed=true \
            -p:PublishReadyToRun=true -p:PackAsTool=false \
            "-p:Version=$VERSION" -o "publish/$RID"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          tar -czf "weave-${VERSION}-${RID}.tar.gz" -C "publish/$RID" .

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/$env:RID/*" -DestinationPath "weave-$env:VERSION-$env:RID.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weave-${{ matrix.rid }}
          path: weave-${{ env.VERSION }}-${{ matrix.rid }}.${{ matrix.archive }}

  github-release:
    name: Create GitHub Release
    needs: [create-release, publish-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      VERSION: ${{ needs.create-release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          sparse-checkout: scripts
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        run: |
          TAG="v${VERSION}"
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}"
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          cat > release-footer.md << FOOTER

          ## Installation

          **One-liner** — installs this release:

          | Platform | Command |
          |----------|---------|
          | **Windows** | \`irm ${RAW}/scripts/install.ps1 \\| iex\` |
          | **macOS / Linux** | \`curl -fsSL ${RAW}/scripts/install.sh \\| sh\` |
          | **.NET tool** | \`dotnet tool install -g Weave.Cli --version ${VERSION}\` |

          Or download an archive above and extract manually. The install scripts are also attached as release assets:
          - [install.sh](${DL}/install.sh)
          - [install.ps1](${DL}/install.ps1)
          FOOTER

          gh release create "${TAG}" \
            --target "$GITHUB_SHA" \
            --title "Release ${TAG}" \
            --generate-notes \
            --notes-file release-footer.md \
            artifacts/weave-${VERSION}-*.zip artifacts/weave-${VERSION}-*.tar.gz \
            artifacts/*.nupkg \
            scripts/install.sh scripts/install.ps1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "## Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**URL**: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "The **publish-nuget** workflow will trigger automatically to publish packages to NuGet.org." >> $GITHUB_STEP_SUMMARY
