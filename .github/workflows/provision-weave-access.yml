name: Provision Weave Access Managed OAuth trial (explicit)

on:
  pull_request:
    branches: [main]
    paths:
      - experiments/cloudflare-managed-oauth/provision.ts
      - experiments/cloudflare-managed-oauth/provision.test.ts
      - .github/workflows/provision-weave-access.yml
  workflow_dispatch:
    inputs:
      create_trial:
        description: 'One-time create: Weave-only /access-trial/*, exact test emails, no other apps, Worker or D1 changes'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
concurrency:
  group: weave-access-managed-oauth-provision
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: hosts/Weave.Mailbox.Worker
      - name: Strictly typecheck Access preflight and provisioning boundary
        run: >-
          hosts/Weave.Mailbox.Worker/node_modules/.bin/tsc --noEmit --strict
          --target es2022 --module esnext --moduleResolution bundler
          --allowImportingTsExtensions --lib es2022,dom,dom.iterable
          --typeRoots hosts/Weave.Mailbox.Worker/node_modules/@types --types node
          experiments/cloudflare-managed-oauth/*.ts
      - name: Exercise failed prerequisites, exact-user policy, POST-once and post-create verification
        run: node --test experiments/cloudflare-managed-oauth/*.test.ts

  provision:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.create_trial == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure the checked out release is the reviewed main commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Create only isolated Weave Access app after permission and exact-identity preflight
        run: node experiments/cloudflare-managed-oauth/provision.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCESS_TRIAL_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_TRIAL_TOKEN }}
          WEAVE_ACCESS_TRIAL_EMAILS: ${{ secrets.WEAVE_ACCESS_TRIAL_EMAILS }}
          WEAVE_ACCESS_TRIAL_COMMIT: create-weave-access-trial
