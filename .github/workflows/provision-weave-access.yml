name: Provision Weave Access Managed OAuth trial (explicit)
# One-time Weave Access application was created and verified on 2026-10-29.
# Retire its privileged creation job; preserve the workflow identity and read-only checks.
# A future application needs a separately reviewed, explicitly authorized workflow change.

on:
  pull_request:
    branches: [main]
    paths:
      - experiments/cloudflare-managed-oauth/**
      - .github/workflows/provision-weave-access.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: weave-access-managed-oauth-provision
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: hosts/Weave.Mailbox.Worker
      - name: Strictly typecheck Access preflight and provisioning boundary
        run: >-
          hosts/Weave.Mailbox.Worker/node_modules/.bin/tsc --noEmit --strict
          --target es2022 --module esnext --moduleResolution bundler
          --allowImportingTsExtensions --lib es2022,dom,dom.iterable
          --typeRoots hosts/Weave.Mailbox.Worker/node_modules/@types --types node
          experiments/cloudflare-managed-oauth/*.ts
      - name: Exercise failed prerequisites, exact-user policy, POST-once and post-create verification
        run: node --test experiments/cloudflare-managed-oauth/*.test.ts

