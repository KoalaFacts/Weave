name: Approved D1 Human Account Migration
on:
  # Only the approved pre-agent-key source may upgrade existing D1 data.
  # A later main merge must never silently change the migration executable.
  workflow_dispatch:
    inputs:
      confirm_approved_source:
        description: Enter the exact previously approved source commit to run this protected migration
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-weave-worker-demo
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 150ec32e5f2415ed3c64db7e1c0d36655f8dabea
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact reviewed source and unchanged dispatch main
        shell: bash
        env:
          WEAVE_MIGRATION_PIN: 150ec32e5f2415ed3c64db7e1c0d36655f8dabea
          WEAVE_MIGRATION_CONFIRM: ${{ inputs.confirm_approved_source }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$WEAVE_MIGRATION_CONFIRM" = "$WEAVE_MIGRATION_PIN"
          test "$(git rev-parse HEAD)" = "$WEAVE_MIGRATION_PIN"
          git merge-base --is-ancestor "$WEAVE_MIGRATION_PIN" origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate approved migration intent without cloud writes
        run: node scripts/oauth-rollout-intent.ts
        working-directory: typescript/mailbox-worker
        env:
          WEAVE_RELEASE_CONFIGURATION_SCOPE: production
          WEAVE_RELEASE_DATABASE_MODE: maintain
          WEAVE_RELEASE_HUMAN_ACCOUNT_MIGRATION: 'true'
          WEAVE_RELEASE_FIRST_PARTY_OAUTH: 'false'
          WEAVE_RELEASE_ACCESS_TRIAL_APPLICATION: ''
      - run: npm ci --ignore-scripts
        working-directory: typescript/mailbox-worker
      - run: |
          npm run typecheck
          npm test
          npm audit --audit-level=high
        working-directory: typescript/mailbox-worker
      - uses: ./.github/actions/setup-dotnet
      - run: |
          dotnet restore csharp/tests/Weave.Worker.Compatibility/Weave.Worker.Compatibility.csproj --locked-mode
          dotnet build csharp/tests/Weave.Worker.Compatibility/Weave.Worker.Compatibility.csproj --no-restore -c Release
      - run: npm run test:compat
        working-directory: typescript/mailbox-worker
  deploy-production:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 150ec32e5f2415ed3c64db7e1c0d36655f8dabea
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck exact source and main ancestry after protected approval
        shell: bash
        env:
          WEAVE_MIGRATION_PIN: 150ec32e5f2415ed3c64db7e1c0d36655f8dabea
          WEAVE_MIGRATION_CONFIRM: ${{ inputs.confirm_approved_source }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$WEAVE_MIGRATION_CONFIRM" = "$WEAVE_MIGRATION_PIN"
          test "$(git rev-parse HEAD)" = "$WEAVE_MIGRATION_PIN"
          git merge-base --is-ancestor "$WEAVE_MIGRATION_PIN" origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: typescript/mailbox-worker
      - name: Revalidate exclusive human migration intent inside production
        run: node scripts/oauth-rollout-intent.ts
        working-directory: typescript/mailbox-worker
        env:
          WEAVE_RELEASE_CONFIGURATION_SCOPE: production
          WEAVE_RELEASE_DATABASE_MODE: maintain
          WEAVE_RELEASE_HUMAN_ACCOUNT_MIGRATION: 'true'
          WEAVE_RELEASE_FIRST_PARTY_OAUTH: 'false'
          WEAVE_RELEASE_ACCESS_TRIAL_APPLICATION: ''
      - name: Check remote D1, retain time-travel bookmark and migrate only the approved source
        run: node scripts/deploy.ts
        working-directory: typescript/mailbox-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEAVE_DEPLOY_DATABASE_MODE: maintain
          WEAVE_APPROVED_HUMAN_ONBOARDING_SCHEMA: 'true'
          WEAVE_APPROVED_FIRST_PARTY_OAUTH_BINDING: 'false'
      - name: Verify the published Agent Start guide and homepage
        run: node scripts/verify-agent-entry.ts
        working-directory: typescript/mailbox-worker
      - name: Verify published public MCP handshake, discovery and D1 read
        run: node scripts/verify-public-mcp.ts
        working-directory: typescript/mailbox-worker
      - name: Retain protected D1 recovery evidence even if deployment fails
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weave-human-migration-recovery-${{ github.run_id }}
          path: typescript/mailbox-worker/test-results/deployment/result.json
          if-no-files-found: warn
          retention-days: 7
