name: Deploy Weave Worker
on:
  # An explicit release signal, not automatic deployment on ordinary main pushes.
  push:
    branches: [publish/demo]
  workflow_dispatch:
    inputs:
      configuration_scope:
        description: Use configured repository values or the existing production environment
        required: true
        type: choice
        options: [repository, production]
      database_mode:
        description: Require completed migration and unchanged schema, or run the normal reviewed maintenance flow
        required: true
        type: choice
        default: maintain
        options: [maintain, completed-only]
      enable_first_party_oauth:
        description: Separately approved one-time production OAuth bootstrap; requires existing AS, KV, DO, signing secret and completed-only mode
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: deploy-weave-worker-demo
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/publish/demo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release commit is already on main
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Gate opt-in OAuth release before all other release work
        shell: bash
        run: node typescript/mailbox-worker/scripts/oauth-rollout-intent.ts
        env:
          WEAVE_RELEASE_CONFIGURATION_SCOPE: ${{ inputs.configuration_scope }}
          WEAVE_RELEASE_DATABASE_MODE: ${{ inputs.database_mode }}
          WEAVE_RELEASE_FIRST_PARTY_OAUTH: ${{ inputs.enable_first_party_oauth }}
      - run: npm ci --ignore-scripts
        working-directory: typescript/mailbox-worker
      - run: |
          npm run typecheck
          npm test
          npm audit --audit-level=high
        working-directory: typescript/mailbox-worker
  deploy-repository:
    needs: verify
    if: inputs.configuration_scope == 'repository' || (github.event_name == 'push' && github.ref == 'refs/heads/publish/demo')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: typescript/mailbox-worker
      - name: Verify resources, migrate, confirm, and deploy existing demo
        run: node scripts/deploy.ts
        working-directory: typescript/mailbox-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEAVE_DEPLOY_DATABASE_MODE: ${{ github.event_name == 'push' && 'completed-only' || inputs.database_mode }}
      - name: Verify the published Agent Start guide and homepage
        run: node scripts/verify-agent-entry.ts
        working-directory: typescript/mailbox-worker
      - name: Verify published public MCP handshake, discovery and D1 read
        run: node scripts/verify-public-mcp.ts
        working-directory: typescript/mailbox-worker
  deploy-production:
    needs: verify
    if: inputs.configuration_scope == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: typescript/mailbox-worker
      - name: Revalidate opt-in OAuth release inside protected production
        run: node scripts/oauth-rollout-intent.ts
        working-directory: typescript/mailbox-worker
        env:
          WEAVE_RELEASE_CONFIGURATION_SCOPE: ${{ inputs.configuration_scope }}
          WEAVE_RELEASE_DATABASE_MODE: ${{ inputs.database_mode }}
          WEAVE_RELEASE_FIRST_PARTY_OAUTH: ${{ inputs.enable_first_party_oauth }}
      - name: Verify resources, migrate, confirm, and deploy existing demo
        run: node scripts/deploy.ts
        working-directory: typescript/mailbox-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEAVE_DEPLOY_DATABASE_MODE: ${{ github.event_name == 'push' && 'completed-only' || inputs.database_mode }}
          WEAVE_APPROVED_FIRST_PARTY_OAUTH_BINDING: ${{ inputs.enable_first_party_oauth == true && 'true' || 'false' }}
      - name: Verify the published Agent Start guide and homepage
        run: node scripts/verify-agent-entry.ts
        working-directory: typescript/mailbox-worker
      - name: Verify published public MCP handshake, discovery and D1 read
        run: node scripts/verify-public-mcp.ts
        working-directory: typescript/mailbox-worker
