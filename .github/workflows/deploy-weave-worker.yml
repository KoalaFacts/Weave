name: Deploy Weave Worker
on:
  # An explicit release signal, not automatic deployment on ordinary main pushes.
  push:
    branches: [publish/demo]
  workflow_dispatch:
    inputs:
      configuration_scope:
        description: Use configured repository values or the existing production environment
        required: true
        type: choice
        options: [repository, production]
permissions:
  contents: read
concurrency:
  group: deploy-weave-worker-demo
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/publish/demo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release commit is already on main
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: hosts/Weave.Mailbox.Worker
      - uses: ./.github/actions/setup-dotnet
      - run: |
          npm run typecheck
          npm test
          npm audit --audit-level=high
        working-directory: hosts/Weave.Mailbox.Worker
      - run: |
          dotnet restore tests/Weave.Worker.Compatibility/Weave.Worker.Compatibility.csproj --locked-mode
          dotnet build tests/Weave.Worker.Compatibility/Weave.Worker.Compatibility.csproj --no-restore -c Release
      - run: npm run test:compat
        working-directory: hosts/Weave.Mailbox.Worker
  deploy-repository:
    needs: verify
    if: inputs.configuration_scope == 'repository' || (github.event_name == 'push' && github.ref == 'refs/heads/publish/demo')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: hosts/Weave.Mailbox.Worker
      - name: Verify resources, migrate, confirm, and deploy existing demo
        run: node scripts/deploy.ts
        working-directory: hosts/Weave.Mailbox.Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the published Agent Start guide and homepage
        run: node scripts/verify-agent-entry.ts
        working-directory: hosts/Weave.Mailbox.Worker
  deploy-production:
    needs: verify
    if: inputs.configuration_scope == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: hosts/Weave.Mailbox.Worker
      - name: Verify resources, migrate, confirm, and deploy existing demo
        run: node scripts/deploy.ts
        working-directory: hosts/Weave.Mailbox.Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the published Agent Start guide and homepage
        run: node scripts/verify-agent-entry.ts
        working-directory: hosts/Weave.Mailbox.Worker
