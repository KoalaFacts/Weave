name: Deploy Weave Worker
on:
  # An explicit release signal, not automatic deployment on ordinary main pushes.
  push:
    branches: [publish/demo]
  # Production-protected fallback for authenticated GitHub connector clients.
  # Only the exact owner command on #236 can use this release entry.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      configuration_scope:
        description: Use configured repository values or the existing production environment
        required: true
        type: choice
        options: [repository, production]
      database_mode:
        description: Require completed migration and unchanged schema, or run the normal reviewed maintenance flow
        required: true
        type: choice
        default: maintain
        options: [maintain, completed-only]
      enable_first_party_oauth:
        description: Separately approved one-time production OAuth bootstrap; requires existing AS, KV, DO, signing secret and completed-only mode
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # All issue comments trigger this workflow, even when its release job skips.
  # Only an exact owner-authored release request may join the production lock
  # shared with the read-only D1 inventory. Other comments get unique groups
  # instead of cancelling an audit while it is pending behind a deployment.
  group: >-
    ${{ github.event_name == 'issue_comment' &&
        (github.event.issue.number != 236 ||
         github.event.issue.pull_request != null ||
         github.event.comment.body != '/weave-deploy-demo' ||
         github.event.comment.user.login != 'ldsenow' ||
         github.event.comment.author_association != 'MEMBER' ||
         github.actor != 'ldsenow') &&
        format('ignored-issue-comment-{0}', github.run_id) ||
        'deploy-weave-worker-demo' }}
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/publish/demo') ||
      (github.event_name == 'issue_comment' &&
       github.ref == 'refs/heads/main' &&
       github.event.issue.number == 236 &&
       github.event.issue.pull_request == null &&
       github.event.comment.body == '/weave-deploy-demo' &&
       github.event.comment.user.login == 'ldsenow' &&
       github.event.comment.author_association == 'MEMBER' &&
       github.actor == 'ldsenow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require authenticated owner command and unchanged main before release
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          WEAVE_EVENT_BODY: ${{ github.event.comment.body }}
          WEAVE_EVENT_USER: ${{ github.event.comment.user.login }}
          WEAVE_EVENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          WEAVE_EVENT_ISSUE: ${{ github.event.issue.number }}
          WEAVE_EVENT_IS_PR: ${{ github.event.issue.pull_request != null }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = ldsenow
          test "$GITHUB_REF" = refs/heads/main
          test "$WEAVE_EVENT_ISSUE" = 236
          test "$WEAVE_EVENT_IS_PR" = false
          test "$WEAVE_EVENT_BODY" = /weave-deploy-demo
          test "$WEAVE_EVENT_USER" = ldsenow
          test "$WEAVE_EVENT_ASSOCIATION" = MEMBER
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Verify the release commit is already on main
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Gate opt-in OAuth release before all other release work
        shell: bash
        run: node typescript/mailbox-worker/scripts/oauth-rollout-intent.ts
        env:
          WEAVE_RELEASE_CONFIGURATION_SCOPE: ${{ github.event_name == 'issue_comment' && 'production' || inputs.configuration_scope }}
          WEAVE_RELEASE_DATABASE_MODE: ${{ github.event_name == 'issue_comment' && 'completed-only' || inputs.database_mode }}
          WEAVE_RELEASE_FIRST_PARTY_OAUTH: ${{ github.event_name == 'issue_comment' && 'false' || inputs.enable_first_party_oauth }}
      - run: npm ci --ignore-scripts
        working-directory: typescript/mailbox-worker
      - run: |
          npm run typecheck
          npm test
          npm audit --audit-level=high
        working-directory: typescript/mailbox-worker
  deploy-repository:
    needs: verify
    if: inputs.configuration_scope == 'repository' || (github.event_name == 'push' && github.ref == 'refs/heads/publish/demo')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: typescript/mailbox-worker
      - name: Verify resources, migrate, confirm, and deploy existing demo
        run: node scripts/deploy.ts
        working-directory: typescript/mailbox-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEAVE_DEPLOY_DATABASE_MODE: ${{ github.event_name == 'push' && 'completed-only' || inputs.database_mode }}
      - name: Verify the published Agent Start guide and homepage
        run: node scripts/verify-agent-entry.ts
        working-directory: typescript/mailbox-worker
      - name: Verify published public MCP handshake, discovery and D1 read
        run: node scripts/verify-public-mcp.ts
        working-directory: typescript/mailbox-worker
  deploy-production:
    needs: verify
    if: >-
      inputs.configuration_scope == 'production' ||
      (github.event_name == 'issue_comment' &&
       github.ref == 'refs/heads/main' &&
       github.event.issue.number == 236 &&
       github.event.issue.pull_request == null &&
       github.event.comment.body == '/weave-deploy-demo' &&
       github.event.comment.user.login == 'ldsenow' &&
       github.event.comment.author_association == 'MEMBER' &&
       github.actor == 'ldsenow')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require authenticated owner command and unchanged main before release
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          WEAVE_EVENT_BODY: ${{ github.event.comment.body }}
          WEAVE_EVENT_USER: ${{ github.event.comment.user.login }}
          WEAVE_EVENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          WEAVE_EVENT_ISSUE: ${{ github.event.issue.number }}
          WEAVE_EVENT_IS_PR: ${{ github.event.issue.pull_request != null }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = ldsenow
          test "$GITHUB_REF" = refs/heads/main
          test "$WEAVE_EVENT_ISSUE" = 236
          test "$WEAVE_EVENT_IS_PR" = false
          test "$WEAVE_EVENT_BODY" = /weave-deploy-demo
          test "$WEAVE_EVENT_USER" = ldsenow
          test "$WEAVE_EVENT_ASSOCIATION" = MEMBER
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: typescript/mailbox-worker
      - name: Revalidate opt-in OAuth release inside protected production
        run: node scripts/oauth-rollout-intent.ts
        working-directory: typescript/mailbox-worker
        env:
          WEAVE_RELEASE_CONFIGURATION_SCOPE: ${{ github.event_name == 'issue_comment' && 'production' || inputs.configuration_scope }}
          WEAVE_RELEASE_DATABASE_MODE: ${{ github.event_name == 'issue_comment' && 'completed-only' || inputs.database_mode }}
          WEAVE_RELEASE_FIRST_PARTY_OAUTH: ${{ github.event_name == 'issue_comment' && 'false' || inputs.enable_first_party_oauth }}
      - name: Verify resources, migrate, confirm, and deploy existing demo
        run: node scripts/deploy.ts
        working-directory: typescript/mailbox-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEAVE_DEPLOY_DATABASE_MODE: ${{ github.event_name == 'issue_comment' && 'completed-only' || inputs.database_mode }}
          WEAVE_APPROVED_FIRST_PARTY_OAUTH_BINDING: ${{ github.event_name == 'issue_comment' && 'false' || (inputs.enable_first_party_oauth == true && 'true' || 'false') }}
      - name: Verify the published Agent Start guide and homepage
        run: node scripts/verify-agent-entry.ts
        working-directory: typescript/mailbox-worker
      - name: Verify published public MCP handshake, discovery and D1 read
        run: node scripts/verify-public-mcp.ts
        working-directory: typescript/mailbox-worker
