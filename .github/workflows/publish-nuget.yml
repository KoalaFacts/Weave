name: Publish to NuGet

on:
  workflow_run:
    workflows: [Create Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to republish from a successful Create Release run'
        required: true
        type: string
      release_run_id:
        description: 'Successful main-branch Create Release workflow run ID (not the latest release)'
        required: true
        type: string

concurrency:
  group: publish-nuget
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  verify-source:
    name: Verify exact release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    outputs:
      version: ${{ steps.source.outputs.version }}
      run_id: ${{ steps.source.outputs.run_id }}
      artifact_id: ${{ steps.source.outputs.artifact_id }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Checkout trusted validation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts/release
          persist-credentials: false

      - name: Verify successful same-repository build, artifact, and tag
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.release_run_id }}
          INPUT_VERSION: ${{ inputs.version }}
        run: python3 scripts/release/guard.py resolve

  publish:
    name: Publish verified v${{ needs.verify-source.outputs.version }}
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Weave.Cli/${{ needs.verify-source.outputs.version }}
    env:
      VERSION: ${{ needs.verify-source.outputs.version }}
      SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
      RELEASE_RUN_ID: ${{ needs.verify-source.outputs.run_id }}
    steps:
      - name: Checkout trusted validation code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts/release
          persist-credentials: false

      - name: Setup pinned publishing SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.201'
          dotnet-quality: 'ga'

      - name: Download only the verified immutable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.verify-source.outputs.artifact_id }}
          run-id: ${{ needs.verify-source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: packages
          merge-multiple: true
          digest-mismatch: error

      - name: Verify package identity and version before exposing the publish key
        run: python3 scripts/release/guard.py validate-packages

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NUGET_API_KEY" || { echo '::error::Publishing credential is missing.'; exit 1; }
          for pkg in packages/*.nupkg packages/*.snupkg; do
            if [ -f "$pkg" ]; then
              dotnet nuget push "$pkg" \
                --source https://api.nuget.org/v3/index.json \
                --api-key "$NUGET_API_KEY" \
                --skip-duplicate
            fi
          done

      - name: Publish evidence
        run: |
          printf 'Published version: %s\nSource commit: %s\nRelease run: %s\n' \
            "$VERSION" "$SOURCE_SHA" "$RELEASE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
