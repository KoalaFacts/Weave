name: Prepare dependency integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: github.head_ref == 'dependabot/nuget/multi-41e1e6a291'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.201'
      - name: Restore the actual combined graph
        run: |
          mkdir -p integration-evidence
          dotnet --info > integration-evidence/sdk.txt
          dotnet restore Weave.slnx
          dotnet restore Weave.slnx --locked-mode
      - name: Retain generated locks and exact source provenance
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          root = pathlib.Path('.')
          output = root / 'integration-evidence'
          output.mkdir(exist_ok=True)
          names = subprocess.check_output(['git', 'ls-files', '-z', '**/packages.lock.json']).decode().split('\0')
          changes = subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')
          if any(p and p not in names for p in changes):
              raise SystemExit('Unexpected non-lock working-tree change')
          manifest = {'source': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(), 'files': []}
          with zipfile.ZipFile(output / 'generated-locks.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in sorted(p for p in changes if p):
                  data = (root / name).read_bytes()
                  before = subprocess.check_output(['git', 'show', 'HEAD:' + name])
                  archive.writestr(name, data)
                  archive.writestr('before/' + name, before)
                  manifest['files'].append({'path': name, 'sha': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest(), 'sha256': hashlib.sha256(data).hexdigest()})
              archive.writestr('manifest.json', json.dumps(manifest, indent=2))
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Compile combined dependency changes without relaxing warnings
        run: dotnet build Weave.slnx --no-restore -c Release /p:TreatWarningsAsErrors=true
      - name: Exercise the updated coverage executable
        run: |
          dotnet tool restore
          dotnet tool run dotnet-coverage --version
          dotnet tool run dotnet-coverage collect --output integration-evidence/tool-smoke.cobertura.xml --output-format cobertura -- dotnet --info
          test -s integration-evidence/tool-smoke.cobertura.xml
      - name: Preserve preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-integration-preparation
          path: integration-evidence/
          if-no-files-found: error
          retention-days: 7
