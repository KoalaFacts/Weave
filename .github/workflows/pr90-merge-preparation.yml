name: Prepare PR90 Merge

on:
  push:
    branches: [integration/pr90-sync-2026-09-19]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated merge preparation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: integration/pr90-sync-2026-09-19
      - name: Verify exact parents and create the reviewed combined tree
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main security/release-chain-hardening
          test "$(git rev-parse origin/main)" = ca2d05877c651dcd857ef01f416c752a993763aa
          test "$(git rev-parse origin/security/release-chain-hardening)" = 6a66acda689ef4fc1fc68335cb1014ec2c5ccc3e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit ca2d05877c651dcd857ef01f416c752a993763aa
          git rm .github/workflows/pr90-merge-preparation.yml
          git diff --cached --check
          test "$(git write-tree)" = 5c011a7f616c42853bf5775efe4906c11975d5a3
          python3 -m unittest discover -s scripts/tests -v
          git commit -m 'merge: prepare verified main and PR90 tree preserving both security and dependency updates'
          test "$(git ls-remote origin refs/heads/integration/pr90-sync-2026-09-19 | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/integration/pr90-sync-2026-09-19
          printf 'Combined tree: %s\nPreparation commit: %s\n' "$(git rev-parse HEAD^{tree})" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
