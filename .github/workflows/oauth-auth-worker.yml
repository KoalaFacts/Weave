name: OAuth authorization Worker isolated verification

on:
  push:
    branches: [feat/oauth-existing-account-proof]
    paths:
      - hosts/Weave.Auth.Worker/**
      - hosts/Weave.Mailbox.Worker/src/account-proof.ts
      - .github/workflows/oauth-auth-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weave-auth-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auth-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: hosts/Weave.Auth.Worker
    steps:
      - name: Checkout exact branch SHA without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node 24 (isolated, no deployment credentials)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # Bootstrap a lock artifact only until its reviewed generated bytes are
      # committed. This is NOT a replacement for npm ci/locked full CI.
      - name: Generate candidate dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Install precisely the candidate lock dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck OAuth provider 1.2.4 Service Binding and Durable Objects
        run: npm run typecheck
      - name: Run portable proof and consent tests
        run: npm run test:portable
      - name: Bundle Cloudflare authorization Worker without publishing
        run: npm run build
      - name: Reject high-severity dependency vulnerabilities
        run: npm audit --audit-level=high
      # One-time review bridge: only public npm dependency metadata, never secrets.
      # Remove after the exact generated lockfile is committed.
      - name: Emit candidate lock for repository import
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib
          data=pathlib.Path("package-lock.json").read_bytes()
          assert len(data) < 200000
          print("LOCK_START", len(data), hashlib.sha256(data).hexdigest())
          encoded=base64.b64encode(data).decode('ascii')
          for i in range(0,len(encoded),1024):
              print("LOCK_DATA", encoded[i:i+1024])
          print("LOCK_END")
          PY
      - name: Retain candidate lock for reproducible review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oauth-worker-candidate-lock-${{ github.sha }}
          path: hosts/Weave.Auth.Worker/package-lock.json
          if-no-files-found: warn
          retention-days: 7
