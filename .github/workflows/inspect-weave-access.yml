name: Inspect Weave Managed OAuth prerequisites (read-only)

on:
  pull_request:
    branches: [main]
    paths:
      - experiments/cloudflare-managed-oauth/**
      - .github/workflows/inspect-weave-access.yml
  push:
    branches: [main]
    paths:
      - experiments/cloudflare-managed-oauth/**
      - .github/workflows/inspect-weave-access.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: inspect-weave-managed-oauth
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: hosts/Weave.Mailbox.Worker
      - name: Typecheck the read-only preflight and tests
        run: >-
          hosts/Weave.Mailbox.Worker/node_modules/.bin/tsc --noEmit --strict
          --target es2022 --module esnext --moduleResolution bundler
          --allowImportingTsExtensions --lib es2022,dom,dom.iterable
          --typeRoots hosts/Weave.Mailbox.Worker/node_modules/@types --types node
          experiments/cloudflare-managed-oauth/*.ts
      - name: Test Access API and credential boundaries without real credentials
        run: node --test experiments/cloudflare-managed-oauth/*.test.ts

  inspect:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check existing Weave account and Access API access without writes
        run: node experiments/cloudflare-managed-oauth/preflight.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
