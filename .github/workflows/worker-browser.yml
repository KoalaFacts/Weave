name: Worker verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: worker-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker API, compatibility and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: hosts/Weave.Mailbox.Worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: ./.github/actions/setup-dotnet
      - name: Install locked Worker dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Worker types, API, D1 and MCP
        run: |
          npm run typecheck
          npm test
          npm audit --audit-level=high
      - name: Build original C# wire compatibility fixture
        working-directory: .
        run: |
          dotnet restore tests/Weave.Worker.Compatibility/Weave.Worker.Compatibility.csproj --locked-mode
          dotnet build tests/Weave.Worker.Compatibility/Weave.Worker.Compatibility.csproj --no-restore -c Release
      - name: Exercise C# against local Worker HTTP
        run: npm run test:compat
      - name: Install locked Playwright Chromium and Linux dependencies
        run: npx --no-install playwright install --with-deps --no-shell chromium
      - name: Prepare the managed Worker browser sandbox
        uses: ./.github/actions/setup-playwright-sandbox
        with:
          playwright-package: hosts/Weave.Mailbox.Worker/node_modules/playwright
      - name: Exercise real demo and registry in protected Chrome
        # Playwright manages the matching browser; chromiumSandbox remains enabled.
        # The fixture fails if the runner cannot provide its namespace and seccomp sandbox.
        # Only temporary local D1 and synthetic public controls are used; no cloud credentials.
        run: |
          mkdir -p test-results/browser
          npm run build
          # Raw spec output stays in the artifact; only bounded, escaped annotations enter workflow commands.
          node --test --test-concurrency=1 \
            --test-reporter=spec --test-reporter-destination=test-results/browser/test.log \
            --test-reporter=./test/github-browser-reporter.mjs --test-reporter-destination=stdout \
            test/browser/*.browser.mjs 2>&1 | tee test-results/browser/annotations.log
      - name: Retain synthetic browser screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: worker-browser-evidence
          path: hosts/Weave.Mailbox.Worker/test-results/browser/
          if-no-files-found: warn
          retention-days: 14
